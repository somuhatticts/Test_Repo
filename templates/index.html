<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Excel File Visualizer</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-5">
    <h1 class="mb-4 text-center">Excel File Visualizer</h1>
    {% if error %}
      <div class="alert alert-danger">{{ error }}</div>
    {% endif %}
    <form action="{{ url_for('upload') }}" method="post" enctype="multipart/form-data" class="card p-4 shadow-sm">
      <div class="mb-3">
        <label for="file" class="form-label">Choose an Excel file (.xls, .xlsx)</label>
        <input class="form-control" type="file" id="file" name="file" accept=".xls,.xlsx" required>
      </div>
      <button type="submit" class="btn btn-primary">Upload &amp; View</button>
    </form>
  </div>
</body>
</html>
